appId: video.pluck.app
productName: Pluck
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.husky/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{biome.json,.prettierignore,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.utilities
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Pluck saves downloaded videos to your Documents folder when chosen.
    - NSDownloadsFolderUsageDescription: Pluck saves downloaded videos to your Downloads folder by default.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
