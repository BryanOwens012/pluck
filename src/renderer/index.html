<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <title>Pluck</title>
    <!--
      CSP notes:
      - script-src stays strict ('self') — no remote JS is ever loaded.
      - style-src needs 'unsafe-inline' for the dev-mode HMR CSS injection;
        production bundle inlines the Tailwind output the same way.
      - img-src allows https: so DownloadRow can render YouTube / Vimeo / Zoom
        preview thumbnails directly from each site's CDN. The thumbnail URL
        comes straight from yt-dlp's metadata; we never run remote scripts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
